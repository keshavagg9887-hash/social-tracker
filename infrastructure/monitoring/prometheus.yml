# ==============================================================================
# Prometheus Monitoring & Metrics Scraper Configuration [M3]
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'sep-api'
    metrics_path: '/health'
    scrape_interval: 10s
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'fastapi-backend'
          environment: 'production'

  - job_name: 'sep-video-gateway'
    metrics_path: '/v3/paths/list'
    scrape_interval: 15s
    static_configs:
      - targets: ['video-gateway:9997']
        labels:
          service: 'mediamtx'

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Upstream Services
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    upstream web_frontend {
        server web:80;
    }

    upstream video_gateway_webrtc {
        server video-gateway:8889;
    }

    upstream video_gateway_hls {
        server video-gateway:8888;
    }

    upstream video_gateway_api {
        server video-gateway:9997;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 50M;

        # -------------------------------------------------------------
        # REST API Routes [M3]
        # -------------------------------------------------------------
        location /api/ {
            proxy_pass http://api_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # -------------------------------------------------------------
        # WebSocket Connections [M3]
        # -------------------------------------------------------------
        location /ws/ {
            proxy_pass http://api_backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # -------------------------------------------------------------
        # MediaMTX WebRTC Signaling (WHIP/WHEP) [M1]
        # -------------------------------------------------------------
        location ~* ^/live/(.+)/(whip|whep)$ {
            proxy_pass http://video_gateway_webrtc;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # CORS headers for browser WHIP/WHEP
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, DELETE" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # -------------------------------------------------------------
        # MediaMTX HLS Live Video Fallback [M1]
        # -------------------------------------------------------------
        location /hls/ {
            proxy_pass http://video_gateway_hls/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;

            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # -------------------------------------------------------------
        # MediaMTX Management API [M1]
        # -------------------------------------------------------------
        location /gateway-api/ {
            proxy_pass http://video_gateway_api/v3/;
            proxy_set_header Host $host;
        }

        # -------------------------------------------------------------
        # React Frontend Application [M4]
        # -------------------------------------------------------------
        location / {
            proxy_pass http://web_frontend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
